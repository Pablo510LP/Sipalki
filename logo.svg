<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#glow)" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#gold)" stroke-width="3" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5" />
  
  <!-- Yin Yang / Taegeuk -->
  <g transform="translate(100, 100) scale(0.6)">
    <path d="M 0 0 L 0 -50 A 25 25 0 0 1 0 0 A 25 25 0 0 0 0 50 A 50 50 0 0 1 0 -50 Z" fill="#E03A3E" />
    <path d="M 0 0 L 0 -50 A 25 25 0 0 1 0 0 A 25 25 0 0 0 0 50 A 50 50 0 0 0 0 -50 Z" fill="#0057B8" transform="rotate(180)" />
  </g>
  
  <!-- Character 18 (十八) in Gold Overlay -->
  <g transform="translate(100, 100) scale(0.7)" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- 十 (10) -->
    <line x1="-12" y1="-8" x2="12" y2="-8" />
    <line x1="0" y1="-20" x2="0" y2="4" />
    <!-- 八 (8) -->
    <path d="M -4,8 C -8,12 -12,20 -14,24" />
    <path d="M 4,8 C 8,12 12,20 14,24" />
  </g>

  <!-- Left Swallow (Golondrina) -->
  <path d="M 45 75 C 38 80, 25 85, 18 80 C 28 85, 38 85, 46 80 C 40 86, 30 100, 26 110 C 35 102, 42 95, 48 90 C 44 98, 40 108, 38 120 C 45 108, 48 98, 52 92 C 50 85, 48 78, 45 75 Z" fill="#111111" stroke="url(#gold)" stroke-width="0.75" />
  
  <!-- Right Swallow (Golondrina) -->
  <path d="M 155 75 C 162 80, 175 85, 182 80 C 172 85, 162 85, 154 80 C 160 86, 170 100, 174 110 C 165 102, 158 95, 152 90 C 156 98, 160 108, 162 120 C 155 108, 152 98, 148 92 C 150 85, 152 78, 155 75 Z" fill="#111111" stroke="url(#gold)" stroke-width="0.75" />
  
  <!-- Texts -->
  <text x="100" y="30" font-family="'Outfit', 'Montserrat', sans-serif" font-size="11" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="3.5">SIPALKI-DO</text>
  <text x="100" y="168" font-family="'Outfit', 'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">YONG</text>
  <text x="100" y="180" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="1.5">LA PAMPA</text>
</svg>
